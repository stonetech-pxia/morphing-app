<!doctype html>
<meta charset="utf-8" />
<style>
  @page {
    size: 100mm 220mm;
    margin: 0;
  }
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    font-size: 10.5pt;
    color: #222;
  }
  .r {
    padding: 8mm 7mm;
  }
  .c {
    text-align: center;
  }
  .row {
    display: flex;
    justify-content: space-between;
  }
  .bc {
    position: relative;
    margin: 6mm auto 0;
    width: 72mm;
    height: 22mm;
  }
  .bars {
    display: flex;
    height: 18mm;
    align-items: stretch;
    justify-content: center;
  }
  .bars i {
    display: block;
    background: #111;
  }
  .bars i.short {
    margin-bottom: 4mm;
  }
  .digits {
    position: absolute;
    top: 14.6mm;
    font-size: 10pt;
    letter-spacing: 0.9mm;
  }
</style>
<div class="r">
  <div class="c"><b>MARCHÉ DU PONT</b><br />Épicerie fine · Lugano<br />Via del Ponte 3</div>
  <br />
  <div class="row"><span>Pane integrale</span><span>3.40</span></div>
  <div class="row"><span>Formaggio Alpe</span><span>7.95</span></div>
  <div class="row"><span>Olive verdi</span><span>4.20</span></div>
  <div class="row"><span>Acqua frizzante 6x</span><span>5.10</span></div>
  <div class="row"><span>Caffè in grani</span><span>11.80</span></div>
  <br />
  <div class="row"><b>TOTALE CHF</b><b>32.45</b></div>
  <div class="row"><span>Carta</span><span>32.45</span></div>
  <br />
  <div class="c">14.10.2026 18:42 · Cassa 2<br />Grazie e arrivederci</div>
  <div class="bc">
    <div class="bars" id="bars"></div>
    <div class="digits" id="d0">4</div>
    <div class="digits" id="d1">006381</div>
    <div class="digits" id="d2">333931</div>
  </div>
</div>
<script>
  // 固定的条宽序列，看起来像 EAN 码（不需要能扫）。
  const w = [
    1, 1, 1, 3, 2, 1, 1, 2, 2, 2, 1, 2, 1, 1, 4, 1, 1, 3, 2, 1, 1, 2, 3, 1, 1, 1, 1, 4, 1, 1, 2, 1,
    1, 1, 1, 1, 3, 1, 2, 2, 1, 1, 2, 3, 1, 1, 4, 1, 1, 1, 2, 2, 1, 3, 1, 1, 2, 1, 3, 1, 1, 1, 1,
  ];
  const bars = document.getElementById('bars');
  w.forEach((x, i) => {
    const el = document.createElement('i');
    el.style.width = x * 0.36 + 'mm';
    if (i % 2) el.style.background = '#fff';
    // 起始、中间、结束的护线伸到数字那一排，数字夹在条之间（像 EAN 码）。
    if (!(i < 3 || (i >= 29 && i < 34) || i >= w.length - 3)) el.className = 'short';
    bars.appendChild(el);
  });
  // 数字放在两段短条下面、护线之间。
  const box = document.querySelector('.bc').getBoundingClientRect();
  const at = (i) => bars.children[i].getBoundingClientRect();
  const place = (id, from, to) => {
    const d = document.getElementById(id);
    d.style.left = from - box.left + 'px';
    d.style.width = to - from + 'px';
    d.style.textAlign = 'center';
  };
  place('d0', at(0).left - 16, at(0).left - 2);
  place('d1', at(3).left, at(28).right);
  place('d2', at(34).left, at(w.length - 4).right);
</script>
