// 本地 Expo 模块的 Android 部分（D-321）：桌面小组件用系统的 AppWidgetProvider + RemoteViews，
// 不加 Glance / Compose 依赖（见 D-324 的比较）。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphwidgets'
version = '1.0.0'

android {
  namespace "expo.modules.morphwidgets"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
