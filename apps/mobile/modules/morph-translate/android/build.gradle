// 本地 Expo 模块的 Android 部分（D-170）：Google ML Kit 本机翻译和语言识别。
// 翻译的语言模型（每种约 30 MB）第一次用时由用户确认后下载，之后离线可用；语言识别的模型打包进 App。
// 都不需要 Google Play 服务。ML Kit 是闭源的 Google 组件，和 AGPL 的关系见 DECISIONS P-015。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphtranslate'
version = '1.0.0'

android {
  namespace "expo.modules.morphtranslate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // release 包开了 R8：ML Kit 的内部类不能被合并、改写。
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "com.google.mlkit:translate:17.0.3"
  implementation "com.google.mlkit:language-id:17.0.6"
}
