// 本地 Expo 模块的 Android 部分（D-100、D-101）：ACTION_SEND_MULTIPLE 一次分享多个文件，
// 存储访问框架（ACTION_OPEN_DOCUMENT_TREE）存到用户选的文件夹。只用 Android 系统接口和 androidx.core 的 FileProvider。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphshare'
version = '1.0.0'

android {
  namespace "expo.modules.morphshare"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
