// 本地 Expo 模块的 Android 部分（D-087）：文字识别用 PP-OCRv6（D-269，ONNX Runtime 跑模型，模型是下载的扩展包），
// ML Kit 只留韩文识别器（模型打包进 App）；文档扫描通过 Google Play 服务。ML Kit 是闭源的 Google 组件，和 AGPL 的关系见 DECISIONS P-015。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphvision'
version = '1.0.0'

android {
  namespace "expo.modules.morphvision"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // release 包开了 R8：ML Kit 的内部类不能被合并、改写。
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // 证件照自动框脸（D-252）：模型打包进 App。
  implementation "com.google.mlkit:face-detection:16.1.7"
  // PP-OCRv6 不认韩文，韩文还用 ML Kit（D-269）。
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
  // ONNX Runtime（MIT）：跑 PP-OCRv6 的两个模型（D-269）。
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.30.0"
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
  implementation "com.google.android.gms:play-services-base:18.11.1"
}
