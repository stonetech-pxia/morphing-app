// 本地 Expo 模块的 Android 部分（D-087）：Google ML Kit 文字识别（模型打包进 App，不需要 Google Play 服务）
// 和文档扫描（通过 Google Play 服务）。ML Kit 是闭源的 Google 组件，和 AGPL 的关系见 DECISIONS P-015。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphvision'
version = '1.0.0'

android {
  namespace "expo.modules.morphvision"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // release 包开了 R8：ML Kit 的内部类不能被合并、改写。
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // 证件照自动框脸（D-252）：模型打包进 App。
  implementation "com.google.mlkit:face-detection:16.1.7"
  // 照片里是什么（没有文字的照片做推荐用）：图像标注的基础模型打包进 App。版本没在 Google Maven 上核对过，同步时确认。
  implementation "com.google.mlkit:image-labeling:17.0.9"
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
  implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
  implementation "com.google.android.gms:play-services-base:18.11.1"
}
